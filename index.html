<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>NutriTracker · Lautaro Ribba</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16 4C9 4 5 11 5 17c0 7 5 11 11 11s11-4 11-11c0-6-4-13-11-13z' fill='%2316a34a'/%3E%3Cpath d='M16 8c-3 0-5 4-5 8s2 7 5 7 5-3 5-7-2-8-5-8z' fill='%2322c55e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --border: #e5e7eb;
      --text: #111827;
      --text-2: #6b7280;
      --text-3: #9ca3af;
      --green: #22c55e;
      --green-text: #15803d;
      --green-bg: #dcfce7;
      --amber: #f59e0b;
      --amber-text: #b45309;
      --amber-bg: #fef3c7;
      --red: #ef4444;
      --red-text: #b91c1c;
      --red-bg: #fee2e2;
      --gray: #9ca3af;
      --gray-bg: #f3f4f6;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --green-bg: rgba(34,197,94,.18);
      --green-text: #4ade80;
      --amber-bg: rgba(245,158,11,.18);
      --amber-text: #fbbf24;
      --red-bg: rgba(239,68,68,.18);
      --red-text: #f87171;
      --gray-bg: #273449;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 200ms, color 200ms;
    }
    h1, h2, h3 { margin: 0; font-weight: 600; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    h3 { font-size: 18px; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ========= LAYOUT ========= */
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* ========= WIZARD ========= */
    .wizard {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, var(--bg) 0%, var(--surface-2) 100%);
    }
    .wizard-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 32px;
      max-width: 520px;
      width: 100%;
      border: 1px solid var(--border);
    }
    .wizard-step-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .wizard-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 200ms;
    }
    .wizard-dot.active { background: var(--accent); }
    .wizard h2 { margin-bottom: 8px; }
    .wizard p { color: var(--text-2); margin: 0 0 20px; }
    .wizard ol { padding-left: 20px; color: var(--text-2); margin: 12px 0 20px; }
    .wizard ol li { margin-bottom: 8px; }
    .wizard-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--green-bg);
      color: var(--green-text);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
    }
    .wizard-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* ========= INPUTS ========= */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .field .helper {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 4px;
    }
    .input, .textarea, .select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 200ms, box-shadow 200ms;
      font-size: 14px;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(22,163,74,.15);
    }
    .textarea { resize: vertical; min-height: 70px; }

    /* ========= BUTTONS ========= */
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      transition: all 200ms;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled {
      background: var(--text-3);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn-ghost {
      color: var(--text-2);
      padding: 8px;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      padding: 0;
      color: var(--text-2);
      background: transparent;
    }
    .btn-icon:hover { background: var(--surface-2); color: var(--text); }
    .btn-wa {
      background: var(--accent);
      color: white;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
    }
    .btn-wa:hover { background: var(--accent-hover); }
    .btn-wa.sent {
      background: var(--gray-bg);
      color: var(--text-2);
      cursor: pointer;
    }
    .btn-wa.sent:hover { background: var(--border); color: var(--text); }
    .btn-edit {
      background: transparent;
      color: var(--text-2);
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .btn-edit:hover { background: var(--surface-2); color: var(--text); }
    .btn-mark {
      background: transparent;
      color: var(--green-text);
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--green);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-mark:hover { background: var(--green-bg); }
    .btn-mark.active { background: var(--green); color: white; }

    /* ========= HEADER ========= */
    .header {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo svg { width: 100%; height: 100%; }
    .header-left { display: flex; flex-direction: column; min-width: 0; }
    .header-title {
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-date {
      font-size: 12px;
      color: var(--text-2);
      text-transform: capitalize;
    }
    .header-actions { display: flex; gap: 4px; align-items: center; }
    .header-actions .btn-icon svg { width: 20px; height: 20px; }

    /* ========= MAIN ========= */
    .main {
      flex: 1;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ========= STAT CARDS ========= */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: transform 200ms, box-shadow 200ms;
      position: relative;
      overflow: hidden;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(22,163,74,.15); }
    .stat-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--bar-color, var(--accent));
    }
    .stat-card.green { --bar-color: var(--green); }
    .stat-card.amber { --bar-color: var(--amber); }
    .stat-card.red { --bar-color: var(--red); }
    .stat-card.gray { --bar-color: var(--gray); }
    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 2px;
    }
    .stat-card.green .stat-number { color: var(--green-text); }
    .stat-card.amber .stat-number { color: var(--amber-text); }
    .stat-card.red .stat-number { color: var(--red-text); }

    /* ========= FILTERS ========= */
    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      background: transparent;
      border: 1px solid var(--border);
      transition: all 200ms;
    }
    .tab:hover { color: var(--text); background: var(--surface-2); }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-3);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .toggle-label,
    .field label.toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      user-select: none;
      margin-bottom: 0;
      font-weight: 400;
    }
    .toggle {
      display: inline-block;
      width: 44px;
      height: 24px;
      background: var(--text-3);
      border-radius: 999px;
      position: relative;
      transition: background 200ms;
      flex-shrink: 0;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 200ms, background 200ms;
      box-shadow: 0 2px 4px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.05);
    }
    .toggle-input { display: none; }
    .toggle-input:checked + .toggle { background: var(--accent); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
    .toggle-input:checked + .toggle::after { transform: translateX(20px); }

    /* ========= TABLE ========= */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table { width: 100%; border-collapse: collapse; }
    .table thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .table tbody tr:last-child td { border-bottom: none; }
    .table tbody tr { transition: background 150ms; }
    .table tbody tr:hover { background: var(--surface-2); }
    .table tbody tr.row-red { background: rgba(239,68,68,.04); }
    .table tbody tr.row-amber { background: rgba(245,158,11,.04); }
    .table tbody tr.row-gray { background: rgba(156,163,175,.04); }
    [data-theme="dark"] .table tbody tr.row-red { background: rgba(239,68,68,.08); }
    [data-theme="dark"] .table tbody tr.row-amber { background: rgba(245,158,11,.08); }

    .patient-name {
      font-weight: 500;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .patient-name .intermediary {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 400;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.green { background: var(--green-bg); color: var(--green-text); }
    .badge.amber { background: var(--amber-bg); color: var(--amber-text); }
    .badge.red { background: var(--red-bg); color: var(--red-text); }
    .badge.gray { background: var(--gray-bg); color: var(--text-2); }
    .badge.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .badge-mini {
      display: inline-flex;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-2);
      margin-left: 6px;
    }
    .actions-cell { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }
    .num-cell { color: var(--text); font-weight: 500; }
    .days-warn { color: var(--red-text); font-weight: 600; white-space: nowrap; }
    .days-ok { color: var(--text-2); white-space: nowrap; }
    .table tbody td { white-space: nowrap; }
    .table tbody td:first-child { white-space: normal; }

    /* ========= MOBILE CARDS ========= */
    .cards { display: none; flex-direction: column; gap: 10px; }
    .pcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pcard.red { border-left: 4px solid var(--red); }
    .pcard.amber { border-left: 4px solid var(--amber); }
    .pcard.green { border-left: 4px solid var(--green); }
    .pcard.gray { border-left: 4px solid var(--gray); }
    .pcard-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .pcard-name { font-weight: 600; font-size: 15px; }
    .pcard-meta { font-size: 12px; color: var(--text-2); line-height: 1.5; }
    .pcard-actions { display: flex; gap: 8px; margin-top: 4px; }
    .pcard-actions .btn-wa, .pcard-actions .btn-edit { flex: 1; }

    /* ========= MODAL ========= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 200ms;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      max-width: 520px;
      width: 100%;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 250ms;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 20px; }
    .modal-warning {
      background: var(--amber-bg);
      color: var(--amber-text);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    /* ========= TOAST ========= */
    .toasts {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      animation: slideInRight 250ms;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.error { border-left-color: var(--red); }
    .toast.warn { border-left-color: var(--amber); }
    @keyframes slideInRight {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast.fade { animation: fadeOut 200ms forwards; }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(20px); } }

    /* ========= LOADING ========= */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-2);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }
    .spinner-sm {
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========= EMPTY STATE ========= */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-2);
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .empty h3 { color: var(--text); margin-bottom: 8px; }

    /* ========= OFFLINE BANNER ========= */
    .offline-banner {
      background: var(--amber-bg);
      color: var(--amber-text);
      text-align: center;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
    }

    /* ========= CONFIG PANEL ========= */
    .config-row {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .config-row:last-child { border-bottom: none; }
    .config-row-info { flex: 1; min-width: 0; }
    .config-row-info strong { display: block; margin-bottom: 2px; }
    .config-row-info span {
      font-size: 12px;
      color: var(--text-2);
      word-break: break-all;
    }

    /* ========= RESPONSIVE ========= */
    @media (max-width: 768px) {
      .main { padding: 16px 12px; }
      .header { padding: 10px 12px; }
      .header-title { font-size: 14px; }
      .header-date { font-size: 11px; }
      .table-wrap { display: none; }
      .cards { display: flex; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat-card { padding: 14px 16px; }
      .stat-number { font-size: 24px; }
      .modal-backdrop { padding: 0; align-items: stretch; }
      .modal {
        max-height: 100vh;
        border-radius: 0;

    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) {
        for (const k in attrs) {
          if (k === 'class') e.className = attrs[k];
          else if (k === 'style') e.style.cssText = attrs[k];
          else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
          else if (k === 'html') e.innerHTML = attrs[k];
          else if (attrs[k] === false || attrs[k] == null) {}
          else e.setAttribute(k, attrs[k]);
        }
      }
      if (children != null) {
        const arr = Array.isArray(children) ? children : [children];
        arr.forEach(c => {
          if (c == null || c === false) return;
          if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
          else e.appendChild(c);
        });
      }
      return e;
    }

    function parseFecha(val) {
      if (val == null || val === '') return null;
      // 1) number (Excel serial)
      if (typeof val === 'number' || (/^\d+(\.\d+)?$/.test(String(val).trim()))) {
        const num = Number(val);
        if (num > 20000 && num < 80000) {
          // Excel serial date
          const d = new Date((num - 25569) * 86400000);
          if (!isNaN(d.getTime())) return d;
        }
      }
      const s = String(val).trim();
      // 2) ISO YYYY-MM-DD
      const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (isoMatch) {
        const d = new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]));
        if (!isNaN(d.getTime())) return d;
      }
      // 3) DD/MM/YYYY o DD-MM-YYYY
      const localMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (localMatch) {
        let y = Number(localMatch[3]);
        if (y < 100) y += 2000;
        const d = new Date(y, Number(localMatch[2]) - 1, Number(localMatch[1]));
        if (!isNaN(d.getTime())) return d;
      }
      // 4) fallback: try Date.parse
      const d = new Date(s);
      if (!isNaN(d.getTime())) return d;
      return null;
    }

    function fmtFecha(d) {
      if (!d) return '—';
      return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    }

    function fmtFechaSheet(d) {
      // Date format that Google Sheets accepts well with USER_ENTERED
      return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    }

    function diasEntre(a, b) {
      const ms = b.getTime() - a.getTime();
      return Math.floor(ms / 86400000);
    }

    function parsearNombre(textoB) {
      const t = String(textoB || '').replace(/\r/g, '');
      const partes = t.split('\n').map(s => s.trim()).filter(Boolean);
      if (partes.length >= 2) {
        return { contacto: partes[0], paciente: partes.slice(1).join(' '), esIntermediario: true };
      }
      const uno = (partes[0] || '').trim();
      return { contacto: uno, paciente: uno, esIntermediario: false };
    }

    function primerNombre(n) {
      return String(n || '').trim().split(/\s+/)[0] || '';

    function calcularEstado(p, hoy) {
      if (!p.fechaConsulta) return 'sin';
      const dias = diasEntre(p.fechaConsulta, hoy);
      const intervalo = p.diasEntreControles || 30;
      if (dias < intervalo - 7) return 'aldia';
      if (dias < intervalo) return 'seguimiento';
      // si pasó el intervalo, y hay seguimientos intermedios (>30), buscar próximo múltiplo
      if (intervalo > 30) {
        const ciclo = dias % intervalo;
        if (ciclo >= intervalo - 7 || ciclo < 7) return 'seguimiento';
      }
      return 'pendiente';
    }

    function tieneTelValido(t) {
      if (!t) return false;
      const limpio = String(t).replace(/\D/g, '');

    // ═══════════════════════════════════════════════════════════════
    //                       TOASTS
    // ═══════════════════════════════════════════════════════════════
    function toast(msg, type = 'info', duration = 3000) {
      const t = el('div', { class: `toast ${type}` }, msg);
      $('#toasts').appendChild(t);
      setTimeout(() => {
        t.classList.add('fade');
        setTimeout(() => t.remove(), 200);
      }, duration);
    }

    // ═══════════════════════════════════════════════════════════════
    //                     GOOGLE APIS
    // ═══════════════════════════════════════════════════════════════
    async function fetchSheet() {
      const { apiKey, sheetId } = state.config;
      if (!apiKey || !sheetId) throw new Error('Falta configuración');
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${encodeURIComponent(RANGE_READ)}?key=${encodeURIComponent(apiKey)}`;
      const r = await fetch(url);
      if (!r.ok) {
        if (r.status === 403) throw new Error('API_KEY_INVALID');
        if (r.status === 404) throw new Error('SHEET_NOT_FOUND');
        throw new Error(`HTTP_${r.status}`);
      }
      return r.json();
    }

    function ensureToken() {
      if (state.token && state.tokenExpiry && Date.now() < state.tokenExpiry - 60000) {
        return Promise.resolve(state.token);
      }
      return requestToken();
    }

    function requestToken(forcePrompt = false) {
      return new Promise((resolve, reject) => {
        if (!state.config.clientId) return reject(new Error('NO_CLIENT_ID'));
        if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
          return reject(new Error('GSI_NOT_LOADED'));
        }
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: state.config.clientId,
            scope: OAUTH_SCOPE,
            callback: (resp) => {
              if (resp.error) return reject(new Error(resp.error));
              state.token = resp.access_token;
              const expires = resp.expires_in ? Number(resp.expires_in) : 3600;
              state.tokenExpiry = Date.now() + expires * 1000;
              localStorage.setItem(STORAGE.token, JSON.stringify({
                access_token: resp.access_token,
                expiry: state.tokenExpiry,
              }));
              resolve(resp.access_token);
            },
            error_callback: (err) => reject(err),
          });
          state.tokenClient = client;
          client.requestAccessToken({ prompt: forcePrompt ? 'consent' : '' });
        } catch (e) { reject(e); }
      });
    }

    async function appendRow(values) {
      const token = await ensureToken();
      const { sheetId } = state.config;
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${encodeURIComponent(SHEET_NAME + '!A:N')}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [values] }),
      });
      if (!r.ok) {
        if (r.status === 401) { state.token = null; throw new Error('TOKEN_EXPIRED'); }
        throw new Error(`HTTP_${r.status}`);
      }
      return r.json();
    }

    async function updateRow(rowIndex, values) {
      const token = await ensureToken();
      const { sheetId } = state.config;
      const range = `${SHEET_NAME}!A${rowIndex}:N${rowIndex}`;
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
      const r = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [values] }),
      });
      if (!r.ok) {
        if (r.status === 401) { state.token = null; throw new Error('TOKEN_EXPIRED'); }
        throw new Error(`HTTP_${r.status}`);
      }
      return r.json();
    }

      // vals: array, colStart: 'L' etc.
      const token = await ensureToken();
      const { sheetId } = state.config;
      const colEnd = String.fromCharCode(colStart.charCodeAt(0) + vals.length - 1);
      const range = `${SHEET_NAME}!${colStart}${rowIndex}:${colEnd}${rowIndex}`;
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
      const r = await fetch(url, {

      });

        throw new Error(`HTTP_${r.status}`);

    function transformRows(rawValues) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const patients = [];
      (rawValues || []).forEach((row, idx) => {
        // sheet row number (2-based: A2 is row 2)
        const sheetRow = idx + 2;
        const colB = row[1] || '';
        if (!String(colB).trim()) return; // skip empty
        const nombreInfo = parsearNombre(colB);
        const fechaConsulta = parseFecha(row[4]);
        const ultimoWA = parseFecha(row[3]);
        const ultimoAutoMsj = parseFecha(row[11]);
        const diasEntreControlesRaw = row[6];
        let diasEntreControles = 30;
        if (diasEntreControlesRaw != null && String(diasEntreControlesRaw).trim() !== '') {
          const n = parseInt(String(diasEntreControlesRaw).replace(/\D/g, ''), 10);
          if (!isNaN(n) && n > 0) diasEntreControles = n;
        }
        const autoMsgRaw = String(row[10] || '').trim().toLowerCase();
        const autoMsg = autoMsgRaw === 'sí' || autoMsgRaw === 'si' || autoMsgRaw === 'yes' || autoMsgRaw === 'true' || autoMsgRaw === '1';
        const tel = String(row[13] || '').replace(/[^\d]/g, '');
        const notas = row[12] || '';
        const nombreWA = row[2] || '';
        const diasDesde = fechaConsulta ? diasEntre(fechaConsulta, hoy) : null;
        const estado = calcularEstado({ fechaConsulta, diasEntreControles }, hoy);

        patients.push({
          sheetRow,
          nombreInfo,
          nombreCrudoB: colB,
          nombreWA,
          ultimoWA,
          fechaConsulta,
          diasDesde,
          diasEntreControles,
          autoMsg,
          ultimoAutoMsj,
          notas,
          telefono: tel,
          estado,
        });
      });
      return patients;
    }

    function ordenPacientes(pacientes, modo) {
      modo = modo || 'prioridad';
      const arr = [...pacientes];
      if (modo === 'nombre') {
        arr.sort((a, b) => (a.nombreInfo.paciente || '').localeCompare(b.nombreInfo.paciente || '', 'es', { sensitivity: 'base' }));
      } else if (modo === 'recientes') {
        arr.sort((a, b) => {
          const da = a.fechaConsulta ? a.fechaConsulta.getTime() : 0;
          const db = b.fechaConsulta ? b.fechaConsulta.getTime() : 0;
          return db - da;
        });
      } else if (modo === 'antiguos') {
        arr.sort((a, b) => {
          const da = a.fechaConsulta ? a.fechaConsulta.getTime() : Infinity;
          const db = b.fechaConsulta ? b.fechaConsulta.getTime() : Infinity;
          return da - db;
        });
      } else {
        // prioridad (default)
        const orden = { pendiente: 0, seguimiento: 1, aldia: 2, sin: 3 };
        arr.sort((a, b) => {
          const oa = orden[a.estado] ?? 9;
          const ob = orden[b.estado] ?? 9;
          if (oa !== ob) return oa - ob;
          const da = a.diasDesde == null ? -Infinity : a.diasDesde;
          const db = b.diasDesde == null ? -Infinity : b.diasDesde;
          return db - da;
        });
      }
      return arr;
    }

    function filtrarPacientes(pacientes, filtros) {
      const term = (filtros.search || '').trim().toLowerCase();
      return pacientes.filter(p => {
        if (filtros.status !== 'todos') {
          if (filtros.status !== p.estado) return false;
        }
        if (filtros.autoOnly && !p.autoMsg) return false;
        if (term) {
          const hay = `${p.nombreInfo.contacto} ${p.nombreInfo.paciente} ${p.nombreWA}`.toLowerCase();
          if (!hay.includes(term)) return false;
        }
        return true;
      });
    }

    function contarEstados(pacientes) {
      const c = { aldia: 0, seguimiento: 0, pendiente: 0, sin: 0 };
      pacientes.forEach(p => c[p.estado] = (c[p.estado] || 0) + 1);
      return c;
    }

    //                       CACHE
    // ═══════════════════════════════════════════════════════════════
    function saveCache(values) {
      try {
        localStorage.setItem(STORAGE.cache, JSON.stringify({ ts: Date.now(), values }));
      } catch {}
    }
    function loadCache() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE.cache) || 'null');
        return d && d.values ? d : null;
      } catch { return null; }
    }

      const root = $('#app');
      root.innerHTML = '';
      const card = el('div', { class: 'wizard-card' });
      const dots = el('div', { class: 'wizard-step-indicator' }, [
        el('div', { class: 'wizard-dot' + (step >= 1 ? ' active' : '') }),
        el('div', { class: 'wizard-dot' + (step >= 2 ? ' active' : '') }),
        el('div', { class: 'wizard-dot' + (step >= 3 ? ' active' : '') }),
      ]);
      card.appendChild(dots);

      if (step === 1) renderWizardStep1(card);
      else if (step === 2) renderWizardStep2(card);
      else if (step === 3) renderWizardStep3(card);

      const wrap = el('div', { class: 'wizard' }, card);
      root.appendChild(wrap);
    }

      card.appendChild(el('h2', null, 'Paso 1 · Conectar Google Sheets'));
      card.appendChild(el('p', null, 'Necesitamos una API Key de Google para leer tu sheet.'));

        el('li', { html: 'Andá a <a href="https://console.cloud.google.com/" target="_blank">console.cloud.google.com</a>' }),
        el('li', null, 'Creá un proyecto nuevo (cualquier nombre)'),
        el('li', { html: 'Andá a <a href="https://console.cloud.google.com/apis/library/sheets.googleapis.com" target="_blank">"Habilitar Google Sheets API"</a>' }),
        el('li', { html: 'Después: APIs y servicios → <strong>Credenciales</strong> → "Crear credencial" → <strong>Clave de API</strong>' }),
        el('li', null, 'Copiá la clave y pegala acá ↓'),
      ]);
      card.appendChild(ol);

      const f1 = el('div', { class: 'field' }, [
        el('label', null, 'API Key'),
        el('input', { class: 'input', id: 'wiz-apikey', type: 'text', placeholder: 'AIzaSy…', value: state.config.apiKey }),
      ]);
      const f2 = el('div', { class: 'field' }, [
        el('label', null, 'Sheet ID'),
        el('input', { class: 'input', id: 'wiz-sheetid', type: 'text', value: state.config.sheetId || DEFAULT_SHEET_ID }),

      ]);
      card.appendChild(f1);
      card.appendChild(f2);

      const errorBox = el('div', { id: 'wiz-error', style: 'color: var(--red-text); font-size: 13px; margin-top: 8px;' });
      card.appendChild(errorBox);

      const verifyBtn = el('button', { class: 'btn btn-primary' }, 'Verificar y continuar →');
      verifyBtn.addEventListener('click', async () => {
        errorBox.textContent = '';
        const apiKey = $('#wiz-apikey').value.trim();
        const sheetId = $('#wiz-sheetid').value.trim();
        if (!apiKey) { errorBox.textContent = 'Falta la API Key'; return; }
        if (!sheetId) { errorBox.textContent = 'Falta el Sheet ID'; return; }
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '';
        verifyBtn.appendChild(el('span', { class: 'spinner-sm' }));
        verifyBtn.appendChild(document.createTextNode(' Verificando…'));
        try {
          state.config.apiKey = apiKey;
          state.config.sheetId = sheetId;
          const data = await fetchSheet();
          if (!data || !Array.isArray(data.values)) {
            throw new Error('SHEET_EMPTY');
          }
          localStorage.setItem(STORAGE.apiKey, apiKey);
          localStorage.setItem(STORAGE.sheetId, sheetId);
          toast('Conexión exitosa ✓');
          renderWizard(3);
        } catch (e) {
          let msg = 'Error desconocido. Revisá la API Key y el Sheet ID.';
          if (e.message === 'API_KEY_INVALID') msg = 'API Key inválida o sin acceso a Sheets API.';
          else if (e.message === 'SHEET_NOT_FOUND') msg = 'Sheet no encontrado o no es público. Compartilo como "Cualquiera con el link".';
          else if (e.message === 'SHEET_EMPTY') msg = 'El sheet se conectó pero no devolvió datos. Revisá que la hoja se llame "Pacientes".';
          errorBox.textContent = msg;
        } finally {
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = 'Verificar y continuar →';
        }
      });
      card.appendChild(el('div', { class: 'wizard-actions' }, [
        el('button', { class: 'btn btn-secondary', onclick: () => renderWizard(1) }, '← Atrás'),

        el('button', { class: 'btn btn-secondary', onclick: () => {
          localStorage.removeItem(STORAGE.clientId);
          state.config.clientId = '';

    function renderApp() {

        ? `(${pendientesYSeguimiento}) NutriTracker · Lautaro Ribba`

        app.appendChild(el('div', { class: 'offline-banner' }, '⚠ Sin conexión — mostrando últimos datos cacheados'));

      app.appendChild(renderHeader());
      const main = el('main', { class: 'main' });
      main.appendChild(renderStats());
      main.appendChild(renderFilters());
      main.appendChild(renderListContainer());
      app.appendChild(main);
      root.appendChild(app);

    function renderStats() {
      const counts = contarEstados(state.patients);
      const wrap = el('div', { class: 'stats' });
      const items = [
        { key: 'aldia', label: 'Al día', cls: 'green', count: counts.aldia },
        { key: 'seguimiento', label: 'Seguimiento', cls: 'amber', count: counts.seguimiento },
        { key: 'pendiente', label: 'Pendiente', cls: 'red', count: counts.pendiente },
      ];
      if (counts.sin > 0) {
        items.push({ key: 'sin', label: 'Sin consulta', cls: 'gray', count: counts.sin });
      }
      items.forEach(it => {
        const card = el('div', {
          class: `stat-card ${it.cls}${state.filter.status === it.key ? ' active' : ''}`,
          onclick: () => {
            state.filter.status = state.filter.status === it.key ? 'todos' : it.key;
            renderApp();
          }
        }, [
          el('div', { class: 'stat-number' }, String(it.count)),
          el('div', { class: 'stat-label' }, `${it.label} · ${it.count === 1 ? '1 paciente' : it.count + ' pacientes'}`),
        ]);
        wrap.appendChild(card);
      });
      return wrap;
    }

    function renderFilters() {
      const wrap = el('div', { class: 'filters' });
      const tabs = el('div', { class: 'tabs' });
      const tabsList = [
        { k: 'todos', l: 'Todos' },
        { k: 'pendiente', l: 'Pendiente' },
        { k: 'seguimiento', l: 'Seguimiento' },
        { k: 'aldia', l: 'Al día' },
        { k: 'sin', l: 'Sin consulta' },
      ];
      const counts = contarEstados(state.patients);
      const countFor = (k) => k === 'todos' ? state.patients.length : (counts[k] || 0);
      tabsList.forEach(t => {
        const tab = el('button', {
          class: 'tab' + (state.filter.status === t.k ? ' active' : ''),
          onclick: () => { state.filter.status = t.k; renderApp(); }
        }, `${t.l} (${countFor(t.k)})`);
        tabs.appendChild(tab);
      });
      wrap.appendChild(tabs);

      const searchWrap = el('div', { class: 'search-wrap' });
      searchWrap.appendChild(svgIcon('search'));
      const searchInput = el('input', {
        class: 'search-input',
        type: 'text',
        placeholder: 'Buscar paciente…',
        value: state.filter.search,
      });
      searchInput.addEventListener('input', (e) => {
        state.filter.search = e.target.value;
        renderListOnly();
      });
      searchWrap.appendChild(searchInput);
      wrap.appendChild(searchWrap);

      const tgl = el('label', { class: 'toggle-label' });
      const tglInput = el('input', { type: 'checkbox', class: 'toggle-input' });
      tglInput.checked = state.filter.autoOnly;

        state.filter.autoOnly = e.target.checked;
        renderListOnly();
      });

      tgl.appendChild(document.createTextNode('Solo auto-mensaje'));

      const sortOpts = [
        { v: 'prioridad', l: 'Por prioridad' },
        { v: 'nombre', l: 'Por nombre A-Z' },
        { v: 'recientes', l: 'Última consulta (recientes)' },
        { v: 'antiguos', l: 'Última consulta (antiguos)' },
      ];
      sortOpts.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.v;
        opt.textContent = o.l;
        if (state.filter.sort === o.v) opt.selected = true;
        sortSel.appendChild(opt);
      });
      sortSel.addEventListener('change', (e) => {
        state.filter.sort = e.target.value;

    function renderListContainer() {
      const wrap = el('div', { id: 'list-container' });
      wrap.appendChild(renderList());
      return wrap;
    }

    function renderListOnly() {
      const c = $('#list-container');
      if (!c) return;
      c.innerHTML = '';
      c.appendChild(renderList());
    }

    function renderList() {
      if (state.loading && state.patients.length === 0) {
        const wrap = el('div');
        wrap.appendChild(el('div', { class: 'loading-overlay' }, [
          el('div', { class: 'spinner' }),
          el('div', null, 'Cargando pacientes…'),
        ]));
        return wrap;
      }

      const filtered = filtrarPacientes(ordenPacientes(state.patients, state.filter.sort), state.filter);

      if (filtered.length === 0) {
        const wrap = el('div', { class: 'table-wrap' });
        if (state.patients.length === 0) {
          wrap.appendChild(el('div', { class: 'empty' }, [
            el('div', { class: 'empty-icon' }, '📋'),
            el('h3', null, 'No hay pacientes cargados'),
            el('p', null, state.config.clientId ? 'Tocá + en el header para agregar el primero.' : 'Conectá Google para poder agregar pacientes desde acá.'),
          ]));
        } else {
          wrap.appendChild(el('div', { class: 'empty' }, [
            el('div', { class: 'empty-icon' }, '🔎'),
            el('h3', null, 'Nada coincide'),
            el('p', null, 'Probá cambiando los filtros o el término de búsqueda.'),
          ]));
        }
        return wrap;
      }

      const cont = el('div');
      cont.appendChild(renderTable(filtered));
      cont.appendChild(renderCards(filtered));

    function renderTable(list) {
      const wrap = el('div', { class: 'table-wrap' });
      const tbl = el('table', { class: 'table' });
      const thead = el('thead', null, el('tr', null, [
        el('th', null, 'Paciente'),
        el('th', null, 'Última consulta'),
        el('th', null, 'Días'),
        el('th', null, 'Intervalo'),
        el('th', null, 'Estado'),
        el('th', { style: 'text-align: right;' }, 'Acción'),
      ]));
      const tbody = el('tbody');
      list.forEach(p => tbody.appendChild(renderTableRow(p)));
      tbl.appendChild(thead);
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      return wrap;

    function rowStateClass(estado) {
      return ({ pendiente: 'row-red', seguimiento: 'row-amber', sin: 'row-gray', aldia: '' })[estado] || '';
    }
    function estadoBadge(estado) {
      const m = {
        aldia: { l: 'Al día', c: 'green' },
        seguimiento: { l: 'Seguimiento', c: 'amber' },
        pendiente: { l: 'Pendiente', c: 'red' },
        sin: { l: 'Sin consulta', c: 'gray' },
      };
      const v = m[estado] || m.sin;
      return el('span', { class: `badge ${v.c}` }, v.l);
    }

    function renderTableRow(p) {
      const tr = el('tr', { class: rowStateClass(p.estado) });
      const nameCell = el('td');
      const nameWrap = el('div', { class: 'patient-name' });
      nameWrap.appendChild(el('span', null, p.nombreInfo.paciente || '(sin nombre)'));
      if (p.nombreInfo.esIntermediario) {
        nameWrap.appendChild(el('span', { class: 'intermediary' }, `vía ${p.nombreInfo.contacto}`));
      }
      nameCell.appendChild(nameWrap);
      tr.appendChild(nameCell);
      tr.appendChild(el('td', { class: 'num-cell' }, fmtFecha(p.fechaConsulta)));
      const diasTxt = p.diasDesde == null ? '—' : `${p.diasDesde} d`;
      const diasCls = p.diasDesde != null && p.diasDesde >= p.diasEntreControles ? 'days-warn' : 'days-ok';
      tr.appendChild(el('td', { class: diasCls }, diasTxt));

      const intervaloCell = el('td');
      intervaloCell.appendChild(document.createTextNode(`${p.diasEntreControles} d`));
      if (p.diasEntreControles > 30) {
        intervaloCell.appendChild(el('span', { class: 'badge-mini', title: 'Múltiples seguimientos' }, '🔁'));
      }
      tr.appendChild(intervaloCell);

      tr.appendChild(el('td', null, estadoBadge(p.estado)));
      tr.appendChild(renderActionsCell(p));
      return tr;
    }

    function renderActionsCell(p) {
      const cell = el('td', { class: 'actions-cell' });
      const wrap = el('div', { style: 'display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap;' });

      const necesita = p.estado === 'pendiente' || p.estado === 'seguimiento';
      const canWa = necesita && tieneTelValido(p.telefono) && p.autoMsg;
      const alreadySent = state.sentToday.ids.includes(p.sheetRow);

      if (necesita) {
        if (alreadySent) {
          wrap.appendChild(el('button', { class: 'btn-wa sent', onclick: () => desmarcarContactado(p), title: 'Tocá para deshacer y volver a habilitar el envío' }, 'Contactado ✓ · deshacer'));
        } else {
          if (canWa) {
            const wbtn = el('button', { class: 'btn-wa', onclick: () => enviarWhatsApp(p), title: 'Abrir WhatsApp con el mensaje' });
            wbtn.appendChild(svgIcon('whatsapp'));
            wbtn.appendChild(document.createTextNode(' WhatsApp'));
            wrap.appendChild(wbtn);
          }
          const markBtn = el('button', { class: 'btn-mark', onclick: () => marcarContactado(p), title: 'Marcar como contactado (sin abrir WhatsApp)' }, canWa ? '✓' : '✓ Marcar');
          wrap.appendChild(markBtn);
        }
      } else if (p.estado === 'aldia') {
        wrap.appendChild(el('span', { class: 'badge green' }, '✓ Al día'));
      }

      const editBtn = el('button', { class: 'btn-edit', onclick: () => openPatientModal(p) }, 'Editar');
      wrap.appendChild(editBtn);
      cell.appendChild(wrap);
      return cell;
    }

    function renderCards(list) {
      const wrap = el('div', { class: 'cards' });
      list.forEach(p => {
        const stClass = ({ pendiente: 'red', seguimiento: 'amber', aldia: 'green', sin: 'gray' })[p.estado] || '';
        const card = el('div', { class: `pcard ${stClass}` });
        const top = el('div', { class: 'pcard-top' }, [
          el('div', null, [
            el('div', { class: 'pcard-name' }, p.nombreInfo.paciente || '(sin nombre)'),
            p.nombreInfo.esIntermediario ? el('div', { class: 'intermediary', style: 'font-size:12px;color:var(--text-2);' }, `vía ${p.nombreInfo.contacto}`) : null,
          ]),
          estadoBadge(p.estado),
        ]);
        card.appendChild(top);
        const meta = el('div', { class: 'pcard-meta' });
        const ultimoTxt = p.fechaConsulta ? `Última: ${fmtFecha(p.fechaConsulta)} · hace ${p.diasDesde} días` : 'Sin última consulta';
        meta.appendChild(el('div', null, ultimoTxt));
        let intervaloLine = `Intervalo: cada ${p.diasEntreControles} días`;
        if (p.diasEntreControles > 30) intervaloLine += ' 🔁';
        meta.appendChild(el('div', null, intervaloLine));
        if (!p.autoMsg) meta.appendChild(el('div', null, '· Mensaje manual'));
        if (!tieneTelValido(p.telefono)) meta.appendChild(el('div', null, '· Sin teléfono'));
        card.appendChild(meta);

        const acts = el('div', { class: 'pcard-actions' });
        const necesita = p.estado === 'pendiente' || p.estado === 'seguimiento';
        const canWa = necesita && tieneTelValido(p.telefono) && p.autoMsg;
        const alreadySent = state.sentToday.ids.includes(p.sheetRow);
        if (necesita) {
          if (alreadySent) {
            acts.appendChild(el('button', { class: 'btn-wa sent', onclick: () => desmarcarContactado(p), title: 'Tocá para deshacer' }, 'Contactado ✓ · deshacer'));
          } else {
            if (canWa) {
              const wbtn = el('button', { class: 'btn-wa', onclick: () => enviarWhatsApp(p) });
              wbtn.appendChild(svgIcon('whatsapp'));
              wbtn.appendChild(document.createTextNode(' WhatsApp'));
              acts.appendChild(wbtn);
            }
            acts.appendChild(el('button', { class: 'btn-mark', onclick: () => marcarContactado(p) }, '✓ Marcar'));
          }
        }
        acts.appendChild(el('button', { class: 'btn-edit', onclick: () => openPatientModal(p) }, 'Editar'));
        card.appendChild(acts);
        wrap.appendChild(card);
      });
      return wrap;
    }

    // ═══════════════════════════════════════════════════════════════
    //                  ACCIONES
    // ═══════════════════════════════════════════════════════════════
    async function marcarContactado(p) {
      markSent(p.sheetRow);
      toast(`${primerNombre(p.nombreInfo.paciente)} marcado como contactado ✓`);
      renderApp();
      if (state.token) {
        try {
          await updateCells(p.sheetRow, 'L', [fmtFechaSheet(new Date())]);
        } catch (e) {
          if (e.message === 'TOKEN_EXPIRED') {
            try { await requestToken(); await updateCells(p.sheetRow, 'L', [fmtFechaSheet(new Date())]); } catch {}
          }
        }
      }
    }

    async function desmarcarContactado(p) {
      unmarkSent(p.sheetRow);
      toast(`${primerNombre(p.nombreInfo.paciente)}: contacto deshecho — podés volver a enviar`);
      renderApp();
      // revertir la columna L del sheet al valor anterior
      if (state.token) {
        const valorAnterior = p.ultimoAutoMsj ? fmtFechaSheet(p.ultimoAutoMsj) : '';
        try {
          await updateCells(p.sheetRow, 'L', [valorAnterior]);
        } catch (e) {
          if (e.message === 'TOKEN_EXPIRED') {
            try { await requestToken(); await updateCells(p.sheetRow, 'L', [valorAnterior]); } catch {}
          }
        }
      }
    }

    async function enviarWhatsApp(p) {
      if (!tieneTelValido(p.telefono)) { toast('Teléfono inválido', 'error'); return; }
      const msj = construirMensaje(p);
      const url = `https://wa.me/${p.telefono}?text=${encodeURIComponent(msj)}`;
      window.open(url, '_blank');
      markSent(p.sheetRow);
      renderApp();
      // si tenemos token, actualizamos col L con fecha de hoy
      if (state.token) {
        try {
          await updateCells(p.sheetRow, 'L', [fmtFechaSheet(new Date())]);
        } catch (e) {
          if (e.message === 'TOKEN_EXPIRED') {
            // silenciosamente intentar refrescar
            try { await requestToken(); await updateCells(p.sheetRow, 'L', [fmtFechaSheet(new Date())]); } catch {}
          }
        }
      }
    }

    async function connectGoogle() {
      if (!state.config.clientId) {
        toast('Configurá el Client ID primero', 'warn');
        openConfigModal();
        return;
      }
      try {
        await requestToken();
        toast('Conectado a Google ✓');
        renderApp();
      } catch (e) {
        toast('No se pudo conectar a Google', 'error');
      }
    }

    // ═══════════════════════════════════════════════════════════════
    //                  MODAL PACIENTE
    // ═══════════════════════════════════════════════════════════════
    function openPatientModal(p) {
      const editing = !!p;
      const hasOAuth = !!state.config.clientId;
      const modal = el('div', { class: 'modal' });
      const closeBtn = el('button', { class: 'btn-icon', onclick: closeModal });
      closeBtn.appendChild(svgIcon('close'));
      modal.appendChild(el('div', { class: 'modal-header' }, [
        el('h2', null, editing ? 'Editar paciente' : 'Nuevo paciente'),
        closeBtn,
      ]));

      if (!hasOAuth) {
        const w = el('div', { class: 'modal-warning' });
        w.appendChild(svgIcon('warning'));
        w.appendChild(document.createTextNode('Conectá Google (Configuración → OAuth) para poder agregar y editar pacientes desde acá.'));
        modal.appendChild(w);
      } else if (!state.token) {
        const w = el('div', { class: 'modal-warning' });
        w.appendChild(svgIcon('warning'));
        const wrap = el('div', null, [
          el('div', null, 'Sesión de Google no activa.'),
          el('button', { class: 'btn btn-primary', style: 'margin-top: 6px;', onclick: async () => { await connectGoogle(); closeModal(); openPatientModal(p); } }, 'Conectar Google'),
        ]);
        w.appendChild(wrap);
        modal.appendChild(w);
      }

      const hasIntermediary = editing && p.nombreInfo.esIntermediario;
      // Campos
      const fNombre = el('input', { class: 'input', type: 'text', required: true, value: editing ? p.nombreInfo.paciente : '' });
      const intermediaryCheck = el('input', { type: 'checkbox', class: 'toggle-input' });
      intermediaryCheck.checked = hasIntermediary;
      const fIntermediary = el('input', { class: 'input', type: 'text', value: editing && p.nombreInfo.esIntermediario ? p.nombreInfo.contacto : '', placeholder: 'Mamá, papá, pareja, etc.' });
      const intermediaryField = el('div', { class: 'field', style: hasIntermediary ? '' : 'display:none;' }, [
        el('label', null, 'Nombre del intermediario'),
        fIntermediary,
      ]);
      intermediaryCheck.addEventListener('change', () => {
        intermediaryField.style.display = intermediaryCheck.checked ? '' : 'none';
      });

      const fNombreWA = el('input', { class: 'input', type: 'text', value: editing ? p.nombreWA : '' });
      const fTelefono = el('input', { class: 'input', type: 'tel', value: editing ? p.telefono : '', placeholder: '5493516123456' });
      const fFecha = el('input', { class: 'input', type: 'date', value: editing && p.fechaConsulta ? `${p.fechaConsulta.getFullYear()}-${pad(p.fechaConsulta.getMonth()+1)}-${pad(p.fechaConsulta.getDate())}` : todayStr() });
      const fIntervalo = el('input', { class: 'input', type: 'number', min: '1', step: '1', value: editing ? p.diasEntreControles : 30 });
      const fAutoMsg = el('input', { type: 'checkbox', class: 'toggle-input' });
      fAutoMsg.checked = editing ? p.autoMsg : true;
      const fNotas = el('textarea', { class: 'textarea', rows: '3' }, editing ? p.notas : '');

      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Nombre del paciente *'),
        fNombre,
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', { class: 'toggle-label' }, [
          intermediaryCheck,
          el('span', { class: 'toggle' }),
          document.createTextNode('¿Tiene intermediario? (mamá, papá, pareja…)'),
        ]),
      ]));
      modal.appendChild(intermediaryField);
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Nombre en WhatsApp (opcional)'),
        fNombreWA,
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Teléfono'),
        fTelefono,
        el('div', { class: 'helper' }, 'Con código de país, sin + ni espacios. Ej: 5493516123456'),
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Fecha última consulta'),
        fFecha,
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Días entre controles'),
        fIntervalo,
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', { class: 'toggle-label' }, [
          fAutoMsg,
          el('span', { class: 'toggle' }),
          document.createTextNode('Auto-mensaje activado'),
        ]),
      ]));
      modal.appendChild(el('div', { class: 'field' }, [
        el('label', null, 'Notas'),
        fNotas,
      ]));

      const errorBox = el('div', { id: 'pat-error', style: 'color: var(--red-text); font-size: 13px; margin-top: 8px;' });
      modal.appendChild(errorBox);

      const saveBtn = el('button', { class: 'btn btn-primary' }, editing ? 'Guardar cambios' : 'Crear paciente');
      if (!hasOAuth) saveBtn.disabled = true;

      saveBtn.addEventListener('click', async () => {
        errorBox.textContent = '';
        const nombre = fNombre.value.trim();
        if (!nombre) { errorBox.textContent = 'Falta el nombre del paciente.'; return; }
        const tel = fTelefono.value.replace(/\D/g, '');
        if (tel && (tel.length < 10 || tel.length > 15)) {
          errorBox.textContent = 'El teléfono tiene que tener entre 10 y 15 dígitos.';
          return;
        }
        const intervalo = parseInt(fIntervalo.value, 10);
        if (!intervalo || intervalo < 1) { errorBox.textContent = 'Intervalo inválido.'; return; }
        const fechaStr = fFecha.value;
        let fechaCell = '';
        if (fechaStr) {
          const parts = fechaStr.split('-');
          fechaCell = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        const colB = intermediaryCheck.checked && fIntermediary.value.trim()
          ? `${fIntermediary.value.trim()}\n${nombre}`
          : nombre;
        const autoMsgVal = fAutoMsg.checked ? 'Sí' : 'No';

        // Fila: A=# B=Nombre C=NombreWA D=UltContactoWA E=FechaConsulta F=Días (fórmula vacío)
        // G=Intervalo H=Próximo (vacío) I=DíasParaProx (vacío) J=Estado (vacío) K=Auto L=UltAuto M=Notas N=Tel
        const filaA = editing ? '' : '';
        const row = [
          filaA,
          colB,
          fNombreWA.value.trim(),
          editing ? (p.ultimoWA ? fmtFechaSheet(p.ultimoWA) : '') : '',
          fechaCell,
          '', // F días desde (calculado en el sheet o no, no lo tocamos)
          String(intervalo),
          '', // H próximo
          '', // I días para próx
          '', // J estado
          autoMsgVal,
          editing ? (p.ultimoAutoMsj ? fmtFechaSheet(p.ultimoAutoMsj) : '') : '',
          fNotas.value,
          tel,
        ];

        saveBtn.disabled = true;
        const origText = saveBtn.textContent;
        saveBtn.innerHTML = '';
        saveBtn.appendChild(el('span', { class: 'spinner-sm' }));
        saveBtn.appendChild(document.createTextNode(' Guardando…'));

        try {
          if (editing) {
            await updateRow(p.sheetRow, row);
          } else {
            await appendRow(row);
          }
          toast(editing ? 'Paciente actualizado ✓' : 'Paciente creado ✓');
          closeModal();
          await loadData(true);
        } catch (e) {
          if (e.message === 'TOKEN_EXPIRED') {
            try {
              await requestToken();
              if (editing) await updateRow(p.sheetRow, row);
              else await appendRow(row);
              toast(editing ? 'Paciente actualizado ✓' : 'Paciente creado ✓');
              closeModal();
              await loadData(true);
              return;
            } catch (e2) {
              errorBox.textContent = 'Sesión expirada. Reconectá Google.';
            }
          } else if (e.message === 'NO_CLIENT_ID') {
            errorBox.textContent = 'Falta el Client ID. Configuralo en ajustes.';
          } else {
            errorBox.textContent = 'Error al guardar: ' + e.message;
          }
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = origText;
        }
      });

      const actions = el('div', { class: 'modal-actions' }, [
        el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Cancelar'),
        saveBtn,
      ]);
      modal.appendChild(actions);

      showModal(modal);
    }

    // ═══════════════════════════════════════════════════════════════
    //                  MODAL CONFIG
    // ═══════════════════════════════════════════════════════════════
    function openConfigModal() {
      const modal = el('div', { class: 'modal' });
      const closeBtn = el('button', { class: 'btn-icon', onclick: closeModal });
      closeBtn.appendChild(svgIcon('close'));
      modal.appendChild(el('div', { class: 'modal-header' }, [
        el('h2', null, 'Configuración'),
        closeBtn,
      ]));

      // Theme toggle
      const isDark = (document.documentElement.getAttribute('data-theme') === 'dark');
      const themeRow = el('div', { class: 'config-row' });
      themeRow.appendChild(el('div', { class: 'config-row-info' }, [
        el('strong', null, 'Tema oscuro'),
        el('span', null, 'Cambia el aspecto de la app'),
      ]));
      const themeWrap = el('label', { class: 'toggle-label' });
      const themeInput = el('input', { type: 'checkbox', class: 'toggle-input' });
      themeInput.checked = isDark;
      themeInput.addEventListener('change', () => {
        const t = themeInput.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem(STORAGE.theme, t);
      });
      themeWrap.appendChild(themeInput);
      themeWrap.appendChild(el('span', { class: 'toggle' }));
      themeRow.appendChild(themeWrap);
      modal.appendChild(themeRow);

      // API Key
      const apiField = el('div', { class: 'field', style: 'margin-top: 16px;' });
      apiField.appendChild(el('label', null, 'API Key'));
      const apiInput = el('input', { class: 'input', type: 'text', value: state.config.apiKey });
      apiField.appendChild(apiInput);
      modal.appendChild(apiField);

      // Sheet ID
      const sheetField = el('div', { class: 'field' });
      sheetField.appendChild(el('label', null, 'Sheet ID'));
      const sheetInput = el('input', { class: 'input', type: 'text', value: state.config.sheetId });
      sheetField.appendChild(sheetInput);
      modal.appendChild(sheetField);

      // Client ID
      const clientField = el('div', { class: 'field' });
      clientField.appendChild(el('label', null, 'OAuth Client ID (para editar)'));
      const clientInput = el('input', { class: 'input', type: 'text', value: state.config.clientId, placeholder: 'xxxxx.apps.googleusercontent.com' });
      clientField.appendChild(clientInput);
      modal.appendChild(clientField);

      // Templates editor
      modal.appendChild(el('div', { style: 'margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);' }, [
        el('strong', { style: 'display:block; margin-bottom: 4px;' }, 'Plantillas de mensaje'),
        el('div', { style: 'font-size:12px; color: var(--text-2); margin-bottom: 12px;' }, 'Usá {contacto} para el nombre de quien recibe el mensaje y {paciente} para el nombre del paciente.'),
      ]));
      const tplDirectoField = el('div', { class: 'field' });
      tplDirectoField.appendChild(el('label', null, 'Mensaje directo (al paciente)'));
      const tplDirectoInput = el('textarea', { class: 'textarea', rows: '7' }, localStorage.getItem(STORAGE.templateDirecto) || DEFAULT_TEMPLATE_DIRECTO);
      tplDirectoField.appendChild(tplDirectoInput);
      modal.appendChild(tplDirectoField);

      const tplInterField = el('div', { class: 'field' });
      tplInterField.appendChild(el('label', null, 'Mensaje vía intermediario'));
      const tplInterInput = el('textarea', { class: 'textarea', rows: '7' }, localStorage.getItem(STORAGE.templateIntermediario) || DEFAULT_TEMPLATE_INTERMEDIARIO);
      tplInterField.appendChild(tplInterInput);
      modal.appendChild(tplInterField);

      const resetTplBtn = el('button', { class: 'btn btn-secondary', style: 'margin-bottom: 16px;', onclick: () => {
        tplDirectoInput.value = DEFAULT_TEMPLATE_DIRECTO;
        tplInterInput.value = DEFAULT_TEMPLATE_INTERMEDIARIO;
      } }, 'Restaurar plantillas originales');
      modal.appendChild(resetTplBtn);

      // OAuth status
      const statusRow = el('div', { class: 'config-row' });
      statusRow.appendChild(el('div', { class: 'config-row-info' }, [
        el('strong', null, 'Estado de Google'),
        el('span', null, state.token ? 'Conectado · podés editar' : 'No conectado · solo lectura'),
      ]));
      if (state.token) {
        const disc = el('button', { class: 'btn btn-secondary', onclick: () => {
          state.token = null;
          state.tokenExpiry = null;
          localStorage.removeItem(STORAGE.token);
          toast('Desconectado de Google');
          closeModal();
          renderApp();
        } }, 'Desconectar');
        statusRow.appendChild(disc);
      } else if (state.config.clientId) {
        const conn = el('button', { class: 'btn btn-primary', onclick: async () => {
          try {
            await requestToken();
            toast('Conectado ✓');
            closeModal();
            renderApp();
          } catch (e) { toast('No se pudo conectar', 'error'); }
        } }, 'Conectar ahora');
        statusRow.appendChild(conn);
      }
      modal.appendChild(statusRow);

      // Reset
      const resetRow = el('div', { class: 'config-row' });
      resetRow.appendChild(el('div', { class: 'config-row-info' }, [
        el('strong', null, 'Empezar de cero'),
        el('span', null, 'Borra config y vuelve al wizard'),
      ]));
      resetRow.appendChild(el('button', { class: 'btn btn-secondary', onclick: () => {
        if (confirm('¿Borrar toda la configuración y empezar de cero?')) {
          Object.values(STORAGE).forEach(k => localStorage.removeItem(k));
          location.reload();
        }
      } }, 'Reiniciar'));
      modal.appendChild(resetRow);

      const errorBox = el('div', { style: 'color: var(--red-text); font-size: 13px; margin-top: 8px;' });
      modal.appendChild(errorBox);

      modal.appendChild(el('div', { class: 'modal-actions' }, [
        el('button', { class: 'btn btn-secondary', onclick: closeModal }, 'Cancelar'),
        el('button', { class: 'btn btn-primary', onclick: async () => {
          const newApi = apiInput.value.trim();
          const newSheet = sheetInput.value.trim();
          const newClient = clientInput.value.trim();
          if (!newApi || !newSheet) { errorBox.textContent = 'API Key y Sheet ID son obligatorios.'; return; }
          state.config.apiKey = newApi;
          state.config.sheetId = newSheet;
          state.config.clientId = newClient;
          localStorage.setItem(STORAGE.apiKey, newApi);
          localStorage.setItem(STORAGE.sheetId, newSheet);
          if (newClient) localStorage.setItem(STORAGE.clientId, newClient);
          else localStorage.removeItem(STORAGE.clientId);
          if (tplDirectoInput.value.trim()) localStorage.setItem(STORAGE.templateDirecto, tplDirectoInput.value);
          if (tplInterInput.value.trim()) localStorage.setItem(STORAGE.templateIntermediario, tplInterInput.value);
          toast('Configuración guardada ✓');
          closeModal();
          renderApp();
          loadData(true);
        } }, 'Guardar'),
      ]));

      showModal(modal);
    }

    // ═══════════════════════════════════════════════════════════════
    //                  MODAL HELPERS
    // ═══════════════════════════════════════════════════════════════
    function showModal(content) {
      closeModal();
      const backdrop = el('div', { class: 'modal-backdrop', id: 'modal-backdrop', onclick: (e) => {
        if (e.target === backdrop) closeModal();
      }});
      backdrop.appendChild(content);
      document.body.appendChild(backdrop);
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      const m = $('#modal-backdrop');
      if (m) m.remove();
      document.body.style.overflow = '';
    }

    // ═══════════════════════════════════════════════════════════════
    //                  LOAD DATA
    // ═══════════════════════════════════════════════════════════════
    async function loadData(showToast = false) {
      // mostrar cache primero si hay
      const cached = loadCache();
      if (cached && state.patients.length === 0) {
        state.patients = transformRows(cached.values);
        renderApp();
      }
      state.loading = true;
      if (state.patients.length === 0) renderApp();
      try {
        const data = await fetchSheet();
        const values = data.values || [];
        state.patients = transformRows(values);
        saveCache(values);
        state.loading = false;
        renderApp();
        if (showToast) toast('Datos actualizados ✓');
      } catch (e) {
        state.loading = false;
        if (e.message === 'API_KEY_INVALID') toast('API Key inválida. Revisá la configuración.', 'error', 5000);
        else if (e.message === 'SHEET_NOT_FOUND') toast('Sheet no encontrado o sin permisos públicos.', 'error', 5000);
        else if (!navigator.onLine) toast('Sin conexión. Mostrando cache.', 'warn');
        else toast('Error de conexión: ' + e.message, 'error');
        renderApp();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    //                       INIT
    // ═══════════════════════════════════════════════════════════════
    function initApp() {
      renderApp();
      loadData(false);
    }

    function start() {
      // online/offline
      window.addEventListener('online', () => { state.offline = false; renderApp(); });
      window.addEventListener('offline', () => { state.offline = true; renderApp(); });
      // ESC closes modal
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      if (!state.config.apiKey || !state.config.sheetId) {
        renderWizard(1);
      } else {
        initApp();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  </script>
</body>
</html>
